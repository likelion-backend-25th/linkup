spring:
  # .env 파일 자동 로드
  config:
    import: optional:file:.env[.properties]

  application:
    name: linkup

  # 데이터베이스 접속 정보
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/linkup_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # 데이터베이스 초기화 설정
  sql:
    init:
      mode: never

  # OAuth2 소셜 로그인 설정
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - profile_image
              - account_email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# MyBatis 설정
mybatis:
  # 매퍼 XML 파일 경로 매핑
  mapper-locations: classpath:mapper/**/*.xml

  # DTO 패키지 별칭 지정
  type-aliases-package: net.likelion.bebc25.linkup

  configuration:
    # DB 컬럼명 스네이크 케이스 → 자바 카멜 케이스
    map-underscore-to-camel-case: true

# Springdoc OpenAPI 및 Swagger UI 설정
springdoc:
  default-produces-media-type: application/json

  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

  api-docs:
    enabled: true
    path: /v3/api-docs

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

# 로깅 설정
logging:
  level:
    # 스프링 시큐리티 전체 로그를 디버그 레벨로 활성화
    org.springframework.security: DEBUG

    # 더 세부적인 필터 체인 통과 흐름을 보려면 TRACE 지정 가능
    # org.springframework.security.web.FilterChainProxy: TRACE

# AWS S3 설정
cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: linkup-user-content